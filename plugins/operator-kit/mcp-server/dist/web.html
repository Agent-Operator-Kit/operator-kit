.feature-card.selected,.project-row.selected{border-color:var(--accent);background:var(--selected)}
.status{background:var(--status-bg);color:var(--status-ink)}.status.active,.status.shaped,.status.completed{background:var(--success-bg);color:var(--success-ink)}.status.blocked,.status.failed{background:var(--warning-bg);color:var(--warning-ink)}.status.human-feedback{background:var(--feedback-bg);color:var(--feedback-ink)}
#sync[data-stale=true],.warning{color:var(--warning-ink);background:var(--warning-bg)}
header{flex-wrap:wrap;gap:12px}.preferences{display:flex;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.preferences label{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px;max-width:100%}select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.workspace{max-width:1600px;margin:auto}.workspace.with-projects{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;padding:16px;gap:16px}.workspace main{width:100%;min-width:0}.with-projects main{padding:0}.projects{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.sidebar-note{font-size:11px;padding:0 12px}.project-row{display:block;width:calc(100% - 12px);margin:6px;padding:12px 10px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer;overflow-wrap:anywhere}.project-row:hover{background:var(--wash)}.project-row strong,.project-row span,.project-row small{display:block}.project-row span{font-size:11px;color:var(--muted);margin:7px 0}.project-row small{font-size:10px;color:var(--muted)}.projects details{padding:12px;border-top:1px solid var(--line);font-size:12px}.projects summary{cursor:pointer;font-weight:650}.projects form{display:grid;gap:10px;margin-top:12px}.projects form label{display:grid;gap:8px}.projects .warning{font-size:11px;overflow-wrap:anywhere;padding:10px}#projects-time{display:block;padding:12px;color:var(--muted);font-size:10px}.layout{grid-template-columns:minmax(210px,.72fr) minmax(0,1.5fr)}.feature-meta{flex-wrap:wrap}.status{white-space:normal;overflow-wrap:anywhere}.section-head{gap:8px}.warning{padding:12px;border-radius:8px}#notice{border:1px solid #637386}.detail-head{overflow-wrap:anywhere}
@media(max-width:1100px){.with-projects .layout{grid-template-columns:1fr}.with-projects .feature-list{max-height:300px;overflow:auto}}
@media(max-width:700px){.workspace.with-projects{grid-template-columns:1fr}.projects{position:static;max-height:350px}.layout{grid-template-columns:1fr}.feature-list{max-height:300px;overflow:auto}.project{display:flex}.preferences{gap:10px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics div{padding:12px}.metrics span{overflow-wrap:anywhere}}
